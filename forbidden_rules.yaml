rules:
  - id: CONTACT-01
    category: contact
    pattern: "(其他|别家|隔壁|那家)\\S{0,6}(会员|企业|客户)\\S{0,6}(手机|电话|微信|联系方式|联系人|负责人|固话)"
    keywords: ["会员的手机", "会员电话", "会员微信", "要对方联系方式", "帮我联系对方"]
    examples:
      - "隔壁那家会员的负责人手机号是多少"
      - "把其他会员的联系人微信给我"
      - "能给我对方公司负责人的电话吗"

  - id: BUSINESS-01
    category: business
    pattern: "(其他|别家|隔壁|那家|某某)\\S{0,8}(会员|企业|客户)\\S{0,10}(营业额|营收|利润|成本|报价|客户名单|合同金额|签约价)"
    keywords: ["其他会员的营业额", "别家的报价", "客户名单", "他们的成本", "签约价格是多少"]
    examples:
      - "其他会员去年的营业额有多少"
      - "别家客户的名单能给我看看吗"
      - "他们和你们签约的价格是多少"

  - id: BUSINESS-02
    category: business
    pattern: "(他们|对方|别家|其他|其它)\\S{0,10}(签约|成交|合同)\\S{0,6}(价|金额|条款)"
    keywords: ["签约的价格", "签约价", "成交价", "合同金额是多少"]
    examples:
      - "他们和你们签约的价格是多少"
      - "对方的成交金额有多大"
      - "别家的合同条款能看看吗"

  - id: COMMIT-01
    category: commitment
    pattern: "(承诺|保证|包干|一定|必须)\\S{0,8}(价格|折扣|最低价|合同条款|优惠|不加价|不涨价)"
    keywords: ["承诺价格", "保证最低价", "包干价", "能不能写在合同里保证", "给我一个承诺", "保证不加价"]
    examples:
      - "你能承诺给我们最低价吗"
      - "合同里能不能保证不加价"
      - "帮我承诺一个包干价格"
